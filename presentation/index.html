<body class="presentation-body">

      <div class="col-12 text-center">
        <!-- Organize Button -->
        <button class="organize-btn" onclick="openOrganizeModal()" title="Organize Cards">

        </button>
        
        <div class="slide-header" data-aos="fade-down">

        <!-- ISO Certifications -->
        <div class="iso-certifications" data-aos="fade-up" data-aos-delay="100">
          <a class="cert-badge" href="iso_27001.pdf" target="_blank" rel="noopener noreferrer" title="Open ISO 27001 certificate (PDF)" aria-label="Open ISO 27001 certificate PDF">

            <small>Certified</small>

          <a class="cert-badge" href="iso_9001.pdf" target="_blank" rel="noopener noreferrer" title="Open ISO 9001 certificate (PDF)" aria-label="Open ISO 9001 certificate PDF">
            <i class="bi bi-award"></i>
            <span>ISO 9001</span>
            <small>Certified</small>
          </a>
          <a class="cert-badge" href="iso_22301.pdf" target="_blank" rel="noopener noreferrer" title="Open ISO 22301 certificate (PDF)" aria-label="Open ISO 22301 certificate PDF">
            <i class="bi bi-arrow-clockwise"></i>

          <!-- Cards will be dynamically generated from JSON config -->
        </div>
      </div>
    </div>
  </div>

  <!-- Organize Modal -->
  <div id="organizeModal" class="organize-modal" onclick="closeOrganizeModal(event)">
    <div class="organize-modal-content" onclick="event.stopPropagation()">
      <div class="organize-modal-header">
        <h2><i class="bi bi-sliders"></i> Organize Cards</h2>
        <button class="organize-modal-close" onclick="closeOrganizeModal()" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="organize-modal-body">
        <div class="organize-cards-list" id="organizeCardsList">
          <!-- Cards will be dynamically generated -->
        </div>
      </div>
      <div class="organize-modal-footer">
        <button class="organize-btn-reset" onclick="resetCardsConfig()">
          <i class="bi bi-arrow-counterclockwise"></i> Reset to Default
        </button>
        <button class="organize-btn-save" onclick="saveCardsConfig()">
          <i class="bi bi-check-lg"></i> Save Changes
        </button>
      </div>
    </div>
  </div>

  <!-- Vendor JS Files -->
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/vendor/aos/aos.js"></script>

  <!-- Card Organization Script -->
  <script src="organize-cards.js"></script>

  <!-- Initialize AOS -->
  <script>
    // Sequential drop animation from top to bottom
    function animateElementsSequentially() {
      const elements = Array.from(document.querySelectorAll('[data-aos]'));
      
      // Sort elements by their position from top to bottom
      elements.sort((a, b) => {
        const rectA = a.getBoundingClientRect();
        const rectB = b.getBoundingClientRect();
        return rectA.top - rectB.top;
      });
      
      // Animate each element with a delay
      elements.forEach((el, index) => {
        setTimeout(() => {
          el.classList.add('aos-animate');
        }, index * 150); // 150ms delay between each element for smoother effect
      });
    }
    
    // Initialize AOS but disable it, we'll use our own animation
    AOS.init({
      duration: 0,
      easing: 'ease-in-out',
      once: true,
      disable: true
    });
    
    // Start sequential animation after page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', animateElementsSequentially);
    } else {
      setTimeout(animateElementsSequentially, 100);
    }
  </script>

</body>
